name: Build & release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Lint
        run: python -m pyflakes src tests

      - name: Tests
        run: python -m pytest -q

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '' }
          if ($version) { ./build.ps1 -Version $version } else { ./build.ps1 }

      # Запускає зібраний Rhythmos.exe, проходить усі вікна й робить знімки екрана (як і на macOS)
      - name: Smoke test (UI screenshots)
        timeout-minutes: 5
        shell: pwsh
        run: |
          $smoke = Join-Path $PWD "smoke"
          $p = Start-Process dist/Rhythmos/Rhythmos.exe -ArgumentList "--smoke-test", "`"$smoke`"" -PassThru -Wait
          New-Item -ItemType Directory -Force $smoke | Out-Null
          Copy-Item "$env:APPDATA/Rhythmos/rhythmos.log" $smoke -ErrorAction SilentlyContinue
          Get-Content "$smoke/rhythmos.log" -Tail 20 -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "smoke test exit code $($p.ExitCode)" }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-smoke
          path: smoke/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/RhythmosSetup-*.exe

  macos:
    runs-on: macos-latest  # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt -r requirements-build.txt

      - name: Tests
        run: python3 -m pytest -q

      - name: Build app and dmg
        run: |
          VERSION=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          bash build_mac.sh $VERSION

      # Запускає зібраний Rhythmos.app, проходить усі вікна й робить знімки екрана
      - name: Smoke test (UI screenshots)
        timeout-minutes: 5
        run: dist/Rhythmos.app/Contents/MacOS/Rhythmos --smoke-test "$PWD/smoke"

      # Самооновлення: копія зібраної програми «вдає» версію 0.0.1, сама завантажує
      # останній реліз із GitHub, замінює себе й перезапускається
      - name: Self-update test
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # без нього спільні IP раннерів упираються в ліміт API
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh release view --repo AirFast/Rhythmos --json tagName --jq '.tagName' | sed 's/^v//')
          APP="$RUNNER_TEMP/Rhythmos.app"
          cp -R dist/Rhythmos.app "$APP"
          RHYTHMOS_VERSION_OVERRIDE=0.0.1 "$APP/Contents/MacOS/Rhythmos" --update-now &
          V=""
          for i in $(seq 1 90); do
            V=$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist" 2>/dev/null || true)
            [ "$V" = "$LATEST" ] && break
            sleep 2
          done
          echo "version after update: $V (latest release: $LATEST)"
          sleep 8
          echo "running after update:"; pgrep -fl "Rhythmos.app/Contents/MacOS/Rhythmos" || echo "(not running)"
          pkill -f "Rhythmos.app/Contents/MacOS/Rhythmos" || true
          test "$V" = "$LATEST"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-smoke
          path: |
            smoke/
            ~/Library/Application Support/Rhythmos/rhythmos.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/Rhythmos-*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/windows/RhythmosSetup-*.exe
            artifacts/macos/Rhythmos-*.dmg
          generate_release_notes: true
